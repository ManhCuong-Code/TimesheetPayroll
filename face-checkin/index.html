<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/" />
    <script>
        (function(l) {
            var isGitHubProject = l.hostname.endsWith('github.io') && l.pathname.indexOf('/TimesheetPayroll') === 0;
            var baseEl = document.querySelector('base');
            if (baseEl) {
                baseEl.setAttribute('href', isGitHubProject ? '/TimesheetPayroll/' : '/');
            }
        })(window.location);
    </script>
    <title>Kiosk Chấm Công Khuôn Mặt AI — TimesheetPayroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --font-body: 'Be Vietnam Pro', Arial, sans-serif;
            --font-heading: 'Be Vietnam Pro', Arial, sans-serif;
            --hrm-font-sans: 'Be Vietnam Pro', 'Plus Jakarta Sans', 'Inter', Arial, sans-serif;
            --hrm-primary: #2563eb;
            --hrm-primary-dark: #1d4ed8;
            --hrm-slate-900: #0f172a;
        }
                        *, *::before, *::after {
            box-sizing: border-box;
        }
        .fa, .fas, .far, .fab, .fa-solid, .fa-regular, .fa-brands,
        i.fa, i.fas, i.far, i.fab, i.fa-solid, i.fa-regular, i.fa-brands,
        [class*="fa-"], [class*="fa-"]::before, [class*="fa-"]::after {
            font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", "FontAwesome" !important;
            font-style: normal !important;
            line-height: 1;
        }
        .fa-brands, .fab { font-family: "Font Awesome 6 Brands" !important; font-weight: 400 !important; }
        .fa-regular, .far { font-family: "Font Awesome 6 Free" !important; font-weight: 400 !important; }
        .fa-solid, .fas { font-family: "Font Awesome 6 Free" !important; font-weight: 900 !important; }
        html, body {
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.6;
            font-weight: 400;
            background-color: var(--hrm-bg-main);
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6 {
            font-family: var(--font-heading);
            line-height: 1.3;
            font-weight: 600;
        }
        button, input, optgroup, select, textarea, .form-control, .form-select { font-family: inherit; }
        code, kbd, pre, samp, .font-mono {
            font-family: 'JetBrains Mono', Consolas, monospace !important;
        }
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 580px;
            height: 420px;
            background: #000;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 3px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(37, 99, 235, 0.2);
            margin: 0 auto;
        }
        #webcamVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 310px;
            border: 2px dashed rgba(96, 165, 250, 0.8);
            border-radius: 50% 50% 45% 45%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.45);
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #60a5fa, transparent);
            top: 0;
            animation: scanning 2s infinite ease-in-out;
        }
        @keyframes scanning {
            0% { top: 0%; opacity: 0.2; }
            50% { top: 100%; opacity: 1; }
            100% { top: 0%; opacity: 0.2; }
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
        }
    </style>
</head>
<body class="py-4">

<div class="container py-2">
    <!-- TOP HEADER -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 border-bottom border-secondary pb-3">
        <a href="./" class="text-decoration-none d-flex align-items-center gap-2 text-white">
            <div class="bg-primary text-white rounded-3 p-2 shadow-sm d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="fa-solid fa-camera-rotate fs-5"></i>
            </div>
            <div>
                <span class="fs-5 fw-bold text-white lh-1 d-block">KIOSK ĐIỂM DANH SINH TRẮC KHUÔN MẶT</span>
                <span class="text-white-50" style="font-size: 0.7rem; font-weight: 600;">TỰ ĐỘNG NHẬN DIỆN DANH TÍNH & PHÂN GIẢI CA LÀM VIỆC</span>
            </div>
        </a>
        <div class="d-flex align-items-center gap-3">
            <div class="text-end d-none d-sm-block">
                <div class="fw-bold text-warning fs-5" id="liveClock">08:02:15</div>
                <small class="text-white-50" id="liveDate">Thứ Tư, 21/10/2026</small>
            </div>
            <a href="admin" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-gauge me-1"></i>Vào Admin
            </a>
        </div>
    </div>

    <!-- MAIN CAMERA & SCANNING SECTION -->
    <div class="row g-4 justify-content-center align-items-center">
        <div class="col-lg-7 text-center">
            <div class="camera-container mb-3">
                <video id="webcamVideo" autoplay playsinline muted></video>
                <div class="scan-overlay">
                    <div class="scan-line"></div>
                </div>
                <div class="position-absolute bottom-0 start-50 translate-middle-x mb-3">
                    <span class="badge bg-dark bg-opacity-75 text-info border border-info px-3 py-2 rounded-pill small">
                        <i class="fa-solid fa-face-viewfinder me-1"></i>Đang tìm kiếm khuôn mặt...
                    </span>
                </div>
            </div>

            <!-- CONTROLS & MANUAL SIMULATION -->
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button class="btn btn-primary px-4 py-2 rounded-pill fw-bold shadow-sm" onclick="triggerFaceScan()">
                    <i class="fa-solid fa-expand me-2"></i>Chụp & Quét Khuôn Mặt Ngay
                </button>
                <button class="btn btn-outline-light px-3 py-2 rounded-pill small" onclick="switchCamera()">
                    <i class="fa-solid fa-arrows-rotate me-1"></i>Đổi Camera
                </button>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card-custom p-4 shadow">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0 text-white"><i class="fa-solid fa-shield-halved text-success me-2"></i>Kết Quả Điểm Danh AI</h5>
                    <span class="badge bg-success rounded-pill px-3 py-1" id="scanStatusBadge">Sẵn Sàng</span>
                </div>

                <div id="resultContentBox" class="p-3 bg-dark bg-opacity-50 rounded-3 border border-secondary mb-3">
                    <div class="text-center py-4 text-white-50">
                        <i class="fa-solid fa-camera display-4 mb-2 text-secondary"></i>
                        <p class="small mb-0">Đưa khuôn mặt vào khung hình camera để hệ thống tự động nhận diện danh tính và xác định ca phân công.</p>
                    </div>
                </div>

                <!-- TEST PROFILE SELECTOR FOR DEMO -->
                <div class="pt-3 border-top border-secondary">
                    <label class="form-label small fw-bold text-white-50 mb-2">
                        <i class="fa-solid fa-flask text-warning me-1"></i>Thử nghiệm nhanh danh tính nhân viên:
                    </label>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-outline-info rounded-pill flex-fill" onclick="simulateEmployeeAttendance(1)">
                            [EMP001] Nguyễn Văn An
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-warning rounded-pill flex-fill" onclick="simulateEmployeeAttendance(6)">
                            [EMP006] Mai Linh (Đa ca)
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary rounded-pill flex-fill" onclick="simulateEmployeeAttendance(7)">
                            [EMP007] Quốc Anh (Ca đêm)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="data/hrm_data.js"></script>
    <script src="data/database_sync.js"></script>
<script>
    var currentStream = null;
    var AudioContext = window.AudioContext || window.webkitAudioContext;
    var audioCtx = null;

    function playBeep(freq = 880, duration = 0.15) {
        try {
            if (!audioCtx) audioCtx = new AudioContext();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function playSuccessTone() {
        playBeep(587.33, 0.1);
        setTimeout(() => playBeep(880, 0.2), 120);
    }

    // Cập nhật đồng hồ thời gian thực
    setInterval(function() {
        var now = new Date();
        document.getElementById('liveClock').textContent = now.toTimeString().split(' ')[0];
    }, 1000);

    // Khởi tạo Camera Webcam
    async function initCamera() {
        try {
            var constraints = { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } };
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            var video = document.getElementById('webcamVideo');
            video.srcObject = currentStream;
        } catch (err) {
            console.warn("Không thể truy cập camera thực tế:", err);
        }
    }
    initCamera();

    async function switchCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        initCamera();
    }

    function triggerFaceScan() {
        // Tự động nhận diện nhân viên ngẫu nhiên hoặc nhân viên mẫu
        simulateEmployeeAttendance(1);
    }

    function simulateEmployeeAttendance(empId) {
        var emp = HRM_DATA.employees.find(x => x.id === empId) || HRM_DATA.employees[0];
        var now = new Date();
        var hour = now.getHours();
        var minute = now.getMinutes();
        var timeStr = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;

        var shiftName = "Ca Hành Chính (08:00 - 17:30)";
        var isNight = false;
        var action = "CHECK-IN";
        var statusClass = "success";
        var note = "Đúng giờ";

        if (emp.id === 7) {
            shiftName = "Ca Đêm (22:00 - 06:00)";
            isNight = true;
            action = (hour >= 20 || hour < 2) ? "CHECK-IN (Bắt đầu ca đêm)" : "CHECK-OUT (Hết ca đêm)";
            note = "Cửa sổ chấm công hợp lệ";
        } else if (emp.id === 6) {
            if (hour >= 7 && hour < 13) {
                shiftName = "Ca Sáng (08:00 - 12:00)";
                action = hour < 11 ? "CHECK-IN" : "CHECK-OUT";
            } else {
                shiftName = "Ca Chiều (13:30 - 17:30)";
                action = hour < 16 ? "CHECK-IN" : "CHECK-OUT";
            }
        } else {
            action = hour < 12 ? "CHECK-IN" : "CHECK-OUT";
            if (hour === 8 && minute > 15) {
                statusClass = "warning";
                note = "Đi muộn " + (minute - 15) + " phút";
            }
        }

        playSuccessTone();

        try {
            localStorage.setItem('hrm_last_punch', JSON.stringify({
                empId: emp.id,
                empCode: emp.code,
                name: emp.name,
                time: timeStr,
                action: action,
                shift: shiftName,
                status: statusClass,
                note: note,
                punchDate: now.toISOString().split('T')[0]
            }));
        } catch(e) {}

        document.getElementById('scanStatusBadge').textContent = 'ĐÃ NHẬN DIỆN THÀNH CÔNG';
        document.getElementById('scanStatusBadge').className = 'badge bg-success rounded-pill px-3 py-1';

        document.getElementById('resultContentBox').innerHTML = `
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="bg-primary text-white rounded-circle p-3 d-flex align-items-center justify-content-center shadow" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-user-check fs-3"></i>
                </div>
                <div>
                    <h5 class="fw-bold text-white mb-0">${emp.name}</h5>
                    <div class="small text-info">Mã NV: <strong>${emp.code}</strong> • ${emp.department}</div>
                </div>
            </div>
            <div class="p-3 bg-white bg-opacity-10 rounded-3 border border-secondary small">
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-white-50">Ca phân công tự xác định:</span>
                    <strong class="text-warning">${shiftName}</strong>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-white-50">Thao tác:</span>
                    <span class="badge bg-primary px-2">${action} lúc ${timeStr}</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-white-50">Độ tin cậy khuôn mặt:</span>
                    <strong class="text-success">98.5% (Face Verified)</strong>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-white-50">Đánh giá hệ thống:</span>
                    <strong class="text-${statusClass}">${note}</strong>
                </div>
            </div>
            <div class="alert alert-success bg-opacity-25 text-white border-0 mt-3 mb-0 small text-center">
                <i class="fa-solid fa-circle-check text-success me-1"></i>Giao dịch SQL Stored Procedure đã ghi nhận thành công!
            </div>
        `;
    }
</script>
</body>
</html>
